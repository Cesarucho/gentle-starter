version: "3"

includes:
  clean:
    taskfile: ./tasks/clean.yml
    dir: ..
  project:
    taskfile: ./tasks/project.yml
    dir: ..
  test:
    taskfile: ./tasks/test.yml
    dir: ..

tasks:
  clean:
    desc: Review and execute project identity cleanup
    dir: ..
    cmds:
      - task: clean:identity

  help:
    desc: Show maintainer task help
    dir: ..
    cmds:
      - task: test:help

  distribution:
    desc: Prepare or update a local consumer branch from an explicit source
    dir: ..
    cmds:
      - python3 .maintainer/scripts/starter-distribution.py {{.CLI_ARGS}}

  distribution:producer:
    desc: Update an existing local starter branch from committed source without switching branches
    dir: ..
    cmds:
      - python3 .maintainer/scripts/starter-producer.py {{.CLI_ARGS}}

  distribution:candidate:
    desc: Build or cancel a local starter-rc candidate without changing starter
    dir: ..
    cmds:
      - python3 .maintainer/scripts/starter-candidate.py {{.CLI_ARGS}}
