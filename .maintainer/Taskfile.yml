version: "3"

includes:
  test:
    taskfile: ./tasks/test.yml
    dir: ..

tasks:
  help:
    desc: Show maintainer task help
    dir: ..
    cmds:
      - task: test:help

  distribution:candidate:
    desc: Build or cancel a local starter-rc candidate without changing starter
    dir: ..
    cmds:
      - python3 .maintainer/scripts/starter-candidate.py {{.CLI_ARGS}}

  distribution:promote:
    desc: Publish an approved local candidate to a linear starter release
    dir: ..
    cmds:
      - python3 .maintainer/scripts/starter-promote.py {{.CLI_ARGS}}
