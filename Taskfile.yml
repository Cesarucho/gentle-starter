version: "3"

includes:
  ai:
    taskfile: ./.taskfiles/ai.yml
  doctor:
    taskfile: ./.taskfiles/doctor.yml
  skill:
    taskfile: ./.taskfiles/skills.yml
  quality:
    taskfile: ./.taskfiles/quality.yml
  ssh:
    taskfile: ./.taskfiles/ssh.yml
  container:
    taskfile: ./.taskfiles/devcontainer.yml
  install:
    taskfile: ./.taskfiles/install.yml

tasks:
  default:
    desc: Show project task help
    cmds:
      - task: help

  doctor:
    desc: Run doctor checks for the detected context
    cmds:
      - task: doctor:auto

  validate:
    desc: Run host-safe validation checks
    cmds:
      - task: doctor
      - task: quality:check

  validate:full:
    desc: Run strict validation checks that require shell quality tools
    cmds:
      - task: doctor
      - task: quality:full

  help:
    desc: Show task help
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Tasks help

        General:
          task help                     Show this help
          task --list                   List all available tasks
          task doctor                   Run doctor checks for the detected context
          task validate                 Run host-safe validation checks, excluding skills
          task validate:full            Run strict validation requiring shell quality tools
          task ai:update                Update Pi packages and re-pin selected packages
          task ai:configure-models      Update Gentle AI model/effort config
          task ssh:check                Check host SSH agent for devcontainer GitHub access

        Doctor:
          task doctor:host              Check host requirements
          task doctor:container         Check tools inside the devcontainer

        Quality:
          task quality:check            Run host-safe shell quality checks
          task quality:full             Run strict shell quality checks
          task quality:shellcheck       Run ShellCheck when available
          task quality:shellcheck:full  Require ShellCheck and run it
          task quality:format           Check shell formatting when available
          task quality:format:full      Require shfmt and check formatting

        Skills:
          task skill:help               Show skill workflow examples
          task skill:list               List installed project skills
          task skill:sync               Restore, update, prune, and validate skills
          task skill:validate           Optional: validate skills-lock against installed skills

        Container:
          task container:help           Show container workflow examples
          task container:rebuild        Remove, build, and start devcontainer
          task container:connect        Open bash inside devcontainer

        Install:
          task install:list             Show enabled install scripts
          task install:enable -- NAME   Enable an available install script
          task install:disable -- NAME  Disable an enabled install script
          task install:doctor           Check install layout integrity
        EOF
