version: "3"

vars:
  WORKSPACE: .

tasks:
  help:
    desc: Show container workflow examples
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Container tasks (all require the host, not inside the container)

          task container:rebuild    Remove, build, and start devcontainer
          task container:restart    Remove and start devcontainer
          task container:build      Build devcontainer
          task container:up         Start devcontainer
          task container:connect    Open bash inside devcontainer
          task container:opencode   Continue the direct OpenCode TUI
          task container:opencode:server  Attach; stop only the task-owned server on exit
          task container:pi         Open pi inside devcontainer
          task container:engram     Open Engram TUI inside devcontainer
          task container:rm         Force-remove devcontainer container
        EOF

  ensure-identity-env:
    internal: true
    silent: true
    cmds:
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          exit 0
        fi
        app_name="$(bash .taskfiles/scripts/project-identity.sh -o name)"
        app_port="$(bash .taskfiles/scripts/project-identity.sh -o code)"
        opencode_port="$((app_port + 1))"
        ssh_port="$((app_port + 2))"
        host_uid="$(id -u)"

        for env_file in ".devcontainer/.env" ".env"; do
          mkdir -p "$(dirname "$env_file")"
          touch "$env_file"

          tmp_file="$(mktemp)"
          awk '!/^(APP_NAME|APP_PORT|OPENCODE_PORT|SSH_PORT|HOST_UID)=/' "$env_file" > "$tmp_file"
          {
            cat "$tmp_file"
            printf 'APP_NAME=%s\n' "$app_name"
            printf 'APP_PORT=%s\n' "$app_port"
            printf 'OPENCODE_PORT=%s\n' "$opencode_port"
            printf 'SSH_PORT=%s\n' "$ssh_port"
            printf 'HOST_UID=%s\n' "$host_uid"
          } > "$env_file"
          rm -f "$tmp_file"
        done

  run-devcontainer:
    internal: true
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        set -a
        . .devcontainer/.env
        set +a
        COMPOSE_PROJECT_NAME="$(python3 .taskfiles/scripts/compose-manifest.py project-name "{{.WORKSPACE}}")" || exit 1
        export COMPOSE_PROJECT_NAME
        devcontainer {{.ARGS}}

  resolve-container-name:
    silent: true
    cmds:
      - |
        set -a
        . .devcontainer/.env
        set +a
        COMPOSE_PROJECT_NAME="$(python3 .taskfiles/scripts/compose-manifest.py project-name "{{.WORKSPACE}}")" || exit 1
        export COMPOSE_PROJECT_NAME
        python3 .taskfiles/scripts/compose-manifest.py name "{{.WORKSPACE}}"

  ensure-running:
    internal: true
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container entrypoints must be run on the host." >&2
          exit 0
        fi
        set -a
        . .devcontainer/.env
        set +a
        COMPOSE_PROJECT_NAME="$(python3 .taskfiles/scripts/compose-manifest.py project-name "{{.WORKSPACE}}")" || exit 1
        export COMPOSE_PROJECT_NAME
        bash .taskfiles/scripts/prepare-bind-mounts.sh "{{.WORKSPACE}}" >/dev/null || exit 1
        container="$(task --silent container:resolve-container-name)"
        if docker ps --filter "name=^/${container}$" --filter "status=running" --quiet | grep -q .; then
          exit 0
        fi

        echo "Devcontainer is not running. Starting it..."
        task container:up

  # Guards: most container tasks must run on the host.
  # They check for /.dockerenv which only exists inside the container.
  # connect/opencode/opencode:server/pi/engram connect through the Dev Container CLI.

  rm:
    desc: Force-remove the devcontainer service container
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container:rm must be run on the host." >&2
          exit 0
        fi
        container="$(task --silent container:resolve-container-name)"
        docker rm -f "$container" 2>/dev/null || true

  build:
    desc: Build devcontainer
    cmds:
      - task: ensure-identity-env
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container:build must be run on the host." >&2
          exit 0
        fi
        set -a
        . .devcontainer/.env
        set +a
        COMPOSE_PROJECT_NAME="$(python3 .taskfiles/scripts/compose-manifest.py project-name "{{.WORKSPACE}}")" || exit 1
        export COMPOSE_PROJECT_NAME
        devcontainer build --workspace-folder {{.WORKSPACE}}

  up:
    desc: Start devcontainer
    interactive: true
    cmds:
      - task: ensure-identity-env
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container:up must be run on the host." >&2
          exit 0
        fi
        set -a
        . .devcontainer/.env
        set +a
        COMPOSE_PROJECT_NAME="$(python3 .taskfiles/scripts/compose-manifest.py project-name "{{.WORKSPACE}}")" || exit 1
        export COMPOSE_PROJECT_NAME
        GENTLE_VOLUME_MANIFEST_ID="$(bash .taskfiles/scripts/prepare-bind-mounts.sh "{{.WORKSPACE}}")" || exit 1
        export GENTLE_VOLUME_MANIFEST_ID
        devcontainer up --workspace-folder {{.WORKSPACE}}

  rebuild:
    desc: Remove, build, and start devcontainer
    cmds:
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container:rebuild must be run on the host." >&2
          exit 0
        fi
        task container:rm
        task container:build
        task container:up

  restart:
    desc: Remove and start devcontainer
    cmds:
      - |
        if [ -f /.dockerenv ] && [ "${FORCE_HOST_CONTEXT:-}" != "1" ]; then
          echo "[skip] container:restart must be run on the host." >&2
          exit 0
        fi
        task container:rm
        task container:up

  connect:
    desc: Open bash inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} bash

  opencode:
    desc: Continue the direct OpenCode TUI inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} opencode --continue

  opencode:server:
    desc: Attach to OpenCode, stopping only the server started by this task
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} bash .taskfiles/scripts/opencode-server.sh

  pi:
    desc: Connect to Pi inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} pi --continue

  engram:
    desc: Connect to Engram TUI inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} engram tui
