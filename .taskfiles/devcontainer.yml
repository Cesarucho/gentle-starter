version: "3"

vars:
  WORKSPACE: .

tasks:
  help:
    desc: Show container workflow examples
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Container tasks

          task container:rebuild    Remove, build, and start devcontainer
          task container:restart    Remove and start devcontainer
          task container:build      Build devcontainer
          task container:up         Start devcontainer
          task container:connect    Open bash inside devcontainer
          task container:pi         Open pi inside devcontainer
          task container:engram     Open Engram TUI inside devcontainer
          task container:rm         Force-remove devcontainer container
          task container:base:apply Apply gentle-starter base files to project
        EOF

  ensure-identity-env:
    internal: true
    silent: true
    cmds:
      - |
        app_name="$(bash .taskfiles/scripts/project-identity.sh -o name)"
        app_port="$(bash .taskfiles/scripts/project-identity.sh -o code)"

        # Write identity to both locations:
        #   .devcontainer/.env  -> compose/devcontainer interpolation
        #   .env                -> runtime env_file for user apps/tools
        for env_file in ".devcontainer/.env" ".env"; do
          mkdir -p "$(dirname "$env_file")"
          touch "$env_file"

          tmp_file="$(mktemp)"
          awk '!/^(APP_NAME|APP_PORT)=/' "$env_file" > "$tmp_file"
          {
            cat "$tmp_file"
            printf 'APP_NAME=%s\n' "$app_name"
            printf 'APP_PORT=%s\n' "$app_port"
          } > "$env_file"
          rm -f "$tmp_file"
        done

  run-devcontainer:
    internal: true
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        set -a
        . .devcontainer/.env
        set +a
        devcontainer {{.ARGS}}

  resolve-container-name:
    silent: true
    cmds:
      - |
        container="$(awk '$1 == "container_name:" { gsub(/^"|"$/, "", $2); print $2; exit }' .devcontainer/docker-compose.yml)"
        project_name="$(bash .taskfiles/scripts/project-identity.sh -o name)"
        container="$(printf '%s' "$container" | sed "s|\${APP_NAME}|$project_name|g")"
        test -n "$container" || {
          echo "missing devcontainer container_name" >&2
          exit 1
        }
        printf '%s\n' "$container"

  ensure-running:
    internal: true
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        container="$(task --silent container:resolve-container-name)"
        if docker ps --filter "name=^/${container}$" --filter "status=running" --quiet | grep -q .; then
          exit 0
        fi

        echo "Devcontainer is not running. Starting it..."
        task container:up

  rm:
    desc: Force-remove the devcontainer service container
    silent: true
    cmds:
      - task: ensure-identity-env
      - |
        container="$(task --silent container:resolve-container-name)"
        docker rm -f "$container" 2>/dev/null || true

  build:
    desc: Build devcontainer
    cmds:
      - task: run-devcontainer
        vars:
          ARGS: build --workspace-folder {{.WORKSPACE}}

  up:
    desc: Start devcontainer
    interactive: true
    cmds:
      - task: run-devcontainer
        vars:
          ARGS: up --workspace-folder {{.WORKSPACE}}

  rebuild:
    desc: Remove, build, and start devcontainer
    cmds:
      - task: rm
      - task: build
      - task: up

  restart:
    desc: Remove and start devcontainer
    cmds:
      - task: rm
      - task: up

  connect:
    desc: Open bash inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} bash

  pi:
    desc: Connect to Pi inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} pi --continue

  engram:
    desc: Connect to Engram TUI inside devcontainer
    interactive: true
    cmds:
      - task: ensure-running
      - task: run-devcontainer
        vars:
          ARGS: exec --workspace-folder {{.WORKSPACE}} engram tui

  base:apply:
    desc: Apply gentle-starter base files to the project workspace.
      Backs up conflicting files to .base-backup/ and replaces them
      with gentle-starter defaults.
    cmds:
      - |
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/.devcontainer"
        WORKSPACE="${WORKSPACE:-.}"
        BACKUP_DIR="${WORKSPACE}/.base-backup"

        echo "Applying gentle-starter base files..."
        echo "Workspace: ${WORKSPACE}"
        echo "Backup dir: ${BACKUP_DIR}"
        mkdir -p "${BACKUP_DIR}"

        for pair in \
          "README.md:README.md" \
          "LICENSE:LICENSE" \
          "CHANGELOG.md:CHANGELOG.md" \
          "skills-lock.json:skills-lock.json"
        do
          src="${pair%%:*}"
          tgt="${pair##*:}"
          src_path="${SCRIPT_DIR}/base/${src}"
          tgt_path="${WORKSPACE}/${tgt}"

          if [ -f "${tgt_path}" ]; then
            echo "  Backup: ${tgt} -> ${BACKUP_DIR}/"
            mv "${tgt_path}" "${BACKUP_DIR}/${tgt}"
          fi

          if [ -f "${src_path}" ]; then
            echo "  Apply: ${src} -> ${tgt}"
            cp "${src_path}" "${tgt_path}"
          else
            echo "  Skip: ${src} (not in base)"
          fi
        done

        agents_src="${SCRIPT_DIR}/agent-skills"
        agents_tgt="${WORKSPACE}/.agents"
        if [ -d "${agents_tgt}" ]; then
          echo "  Backup: .agents/ -> ${BACKUP_DIR}/"
          mv "${agents_tgt}" "${BACKUP_DIR}/.agents"
        fi
        if [ -d "${agents_src}" ]; then
          echo "  Apply: .agents/"
          cp -r "${agents_src}" "${agents_tgt}"
        fi

        echo "Done. Backup at ${BACKUP_DIR}/"
