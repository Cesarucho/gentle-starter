version: "3"

vars:
  SHELL_FILES: .devcontainer/setup.sh .devcontainer/install/01-core/*.sh .devcontainer/install/available/*.sh .devcontainer/install/lib/*.sh .devcontainer/install/templates/*.sh .taskfiles/scripts/*.sh .taskfiles/scripts/starter-lib/*/*.sh

tasks:
  shellcheck:
    desc: Run ShellCheck when available, otherwise skip with a warning
    silent: true
    cmds:
      - |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "[warn] shellcheck not found; skipping shell script analysis"
          exit 0
        fi
        shellcheck {{.SHELL_FILES}}

  shellcheck:full:
    desc: Run ShellCheck and require it to be installed
    silent: true
    cmds:
      - shellcheck {{.SHELL_FILES}}

  format:
    desc: Check shell formatting when shfmt is available, otherwise skip with a warning
    silent: true
    cmds:
      - |
        if ! command -v shfmt >/dev/null 2>&1; then
          echo "[warn] shfmt not found; skipping shell formatting check"
          exit 0
        fi
        shfmt -d {{.SHELL_FILES}}

  format:full:
    desc: Check shell formatting and require shfmt to be installed
    cmds:
      - shfmt -d {{.SHELL_FILES}}

  markdown:
    desc: Run markdownlint-cli2 for repo-owned Markdown when available, otherwise skip with a warning
    silent: true
    cmds:
      - |
        if ! command -v markdownlint-cli2 >/dev/null 2>&1; then
          echo "[warn] markdownlint-cli2 not found; skipping Markdown lint"
          exit 0
        fi
        markdownlint-cli2 --config .markdownlint-cli2.yaml

  markdown:full:
    desc: Run markdownlint-cli2 for repo-owned Markdown and require it to be installed
    cmds:
      - markdownlint-cli2 --config .markdownlint-cli2.yaml

  check:
    desc: Run host-safe repository quality checks
    cmds:
      - task: shellcheck
      - task: format
      - task: markdown

  full:
    desc: Run strict repository quality checks
    cmds:
      - task: shellcheck:full
      - task: format:full
      - task: markdown:full
