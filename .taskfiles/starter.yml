version: "3"

tasks:
  prepare-release:
    desc: Build a reviewable deterministic derived release tree
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter-prepare-release.sh {{.CLI_ARGS}}

  release:
    desc: Create and locally validate an exact annotated starter release
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter-release.sh {{.CLI_ARGS}}

  adopt:
    desc: Adopt an exact integrity-bound starter baseline
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh adopt {{.CLI_ARGS}}

  check:
    desc: Discover and inspect the latest starter release without mutation
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh check {{.CLI_ARGS}}

  update:
    desc: Discover, confirm, and transactionally apply a starter release
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh update {{.CLI_ARGS}}
