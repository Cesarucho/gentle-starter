version: "3"

tasks:
  adopt:
    desc: Adopt an exact verified starter baseline
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh adopt {{.CLI_ARGS}}

  check:
    desc: Inspect starter trust, drift, and update blockers without mutation
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh check {{.CLI_ARGS}}

  update:
    desc: Apply an exact verified starter release transactionally
    silent: true
    cmds:
      - ./.taskfiles/scripts/starter.sh update {{.CLI_ARGS}}
