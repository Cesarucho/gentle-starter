version: "3"

tasks:
  help:
    desc: Show install task help
    silent: true
    cmds:
      - ./.taskfiles/scripts/install.sh help

  list:
    desc: List foundation, mandatory core tools, optional tools, hooks, and inactive catalog entries
    cmds:
      - ./.taskfiles/scripts/install.sh list {{.CLI_ARGS}}

  enable:
    desc: Enable an optional installer in 03-enabled/ (mandatory core tools are protected)
    cmds:
      - ./.taskfiles/scripts/install.sh enable {{.CLI_ARGS}}

  disable:
    desc: Disable an optional installer by removing its 03-enabled/ symlink
    cmds:
      - ./.taskfiles/scripts/install.sh disable {{.CLI_ARGS}}

  doctor:
    desc: Check install layout, canonical core/optional aliases, duplicate targets, and dependency order
    cmds:
      - ./.taskfiles/scripts/install.sh doctor

  versions:validate:
    desc: Validate the declarative tool-version policy file
    cmds:
      - ./.taskfiles/scripts/install.sh versions-validate

  volumes:
    desc: Print desired bind mounts and potential owners from the validated selected Compose manifest
    cmds:
      - ./.taskfiles/scripts/install.sh volumes
