version: "3"

tasks:
  help:
    desc: Show project initialization help
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Project initialization

          task project:init

        Admits the originating exact starter release, removes Gentle Starter
        identity files, creates an adopted parentless root commit on a new
        branch, and optionally updates origin. It never pushes to a remote.
        EOF

  init:
    desc: Create a new project with a parentless Git history
    silent: true
    cmds:
      - ./.taskfiles/scripts/project-init.sh {{.CLI_ARGS}}
