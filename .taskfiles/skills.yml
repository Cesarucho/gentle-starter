version: "3"

tasks:
  suggest:
    desc: Select optional skills from the published starter catalog
    cmds:
      - '{{if .CLI_ARGS}}printf "%s\n" "Use bash .taskfiles/scripts/skills-suggest.sh NAME... for explicit batch names; Task arguments are not accepted." >&2; exit 2{{else}}bash ./.taskfiles/scripts/skills-suggest.sh{{end}}'
