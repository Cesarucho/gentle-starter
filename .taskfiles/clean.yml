version: "3"

tasks:
  help:
    desc: Show clean task help
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Clean tasks help

        Usage:
          task clean              Show this help
          task clean:identity     Remove project identity files

        About clean:identity:
          Removes files that reference "Gentle Starter" so the repo can be
          renamed and used as a new project base or as a migration target.

          DELETED (identity):
            - README.md
            - AGENTS.md
            - docs/
            - LICENSE
            - CHANGELOG.md
            - .github/               (if present)

          KEPT (structure):
            - openspec/              project source of truth
            - .agents/               versioned project skills
            - skills-lock.json       skill lock file
            - .env.example           environment template
            - .gitignore             git ignores
            - .taskfiles/            build and dev tasks
            - .devcontainer/         dev environment

          After running, review the remaining files and manually update:
            - .env.example  (APP_NAME, APP_PORT, APP_IMAGE)
            - openspec/config.yaml  (project name)
        EOF

  identity:
    desc: Remove project identity files (README, docs, LICENSE, CHANGELOG, .github)
    cmds:
      - |
        set -euo pipefail

        ITEMS=(
          "README.md"
          "AGENTS.md"
          "docs/"
          "LICENSE"
          "CHANGELOG.md"
        )

        # .github/ is optional — only remove if it exists
        if [ -d ".github" ]; then
          ITEMS+=(".github/")
        fi

        echo "The following items will be deleted:"
        echo
        for item in "${ITEMS[@]}"; do
          echo "  - $item"
        done
        echo
        echo "The following are kept as base structure:"
        echo
        echo "  - openspec/"
        echo "  - .agents/"
        echo "  - skills-lock.json"
        echo "  - .env.example"
        echo "  - .gitignore"
        echo "  - .taskfiles/"
        echo "  - .devcontainer/"
        echo
        read -rp "Proceed? (y/N) " confirm
        if [ "$confirm" != "y" ] && [ "$confirm" != "Y" ]; then
          echo "Aborted."
          exit 0
        fi

        for item in "${ITEMS[@]}"; do
          if [ -e "$item" ]; then
            rm -rf "$item"
            echo "Deleted: $item"
          else
            echo "Not found (skipped): $item"
          fi
        done

        echo
        echo "Identity removed. Next steps:"
        echo "  1. Review and update .env.example (APP_NAME, APP_PORT, APP_IMAGE)"
        echo "  2. Review openspec/config.yaml (project name)"
        echo "  3. Rename the repo to your project name"
        echo "  4. task validate   # verify the base structure works"
