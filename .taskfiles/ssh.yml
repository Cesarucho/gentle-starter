version: "3"

tasks:
  help:
    desc: Show SSH workflow help (also works as `task ssh`)
    cmds:
      - |
        cat <<'EOF'
        SSH workflow help

        The devcontainer shares your host's SSH agent via a socket mount
        (configured in docker-compose.yml). This means your host's keys
        are available inside the container without copying them.

        Setup (run once per host session):
          task ssh:start

        Before using (verify everything works):
          task ssh:check

        During work (check current state):
          task ssh:status

        When done (optional cleanup):
          task ssh:stop

        How it works:
          1. Host: ssh-agent holds your keys in memory
          2. Container: mounts the agent socket from the host
          3. Git inside the container uses the host's keys automatically

        If SSH_AUTH_SOCK is not set on the host:
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/<your-key>

        If git push asks for credentials inside the container:
          task ssh:check   # diagnose the problem
        EOF

  check:
    desc: Verify SSH agent and GitHub connectivity from host
    cmds:
      - |
        echo "=== SSH Agent Check ==="
        echo

        # 1. Check if SSH_AUTH_SOCK is set
        if [ -z "$SSH_AUTH_SOCK" ]; then
          echo "✗ SSH_AUTH_SOCK is not set"
          echo
          echo "  Run these commands to start:"
          echo "    eval \"\$(ssh-agent -s)\""
          echo "    ssh-add ~/.ssh/<your-key>"
          echo
          echo "  Then run 'task ssh:check' again."
          exit 1
        fi

        echo "✓ SSH_AUTH_SOCK is set: $SSH_AUTH_SOCK"

        # 2. Check if agent process is running
        if [ -n "$SSH_AGENT_PID" ]; then
          if kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
            echo "✓ SSH agent is running (PID: $SSH_AGENT_PID)"
          else
            echo "✗ SSH_AGENT_PID is set but process is not running"
            echo "  Run: task ssh:start"
            exit 1
          fi
        fi

        echo

        # 3. List loaded keys
        echo "=== Loaded Keys ==="
        if ssh-add -l 2>/dev/null; then
          echo
          echo "✓ Keys are loaded and ready"
        else
          code=$?
          if [ $code -eq 1 ]; then
            echo "✗ No keys loaded"
            echo
            echo "  Run: ssh-add ~/.ssh/<your-key>"
            exit 1
          else
            echo "✗ Cannot connect to SSH agent (code: $code)"
            echo "  Run: task ssh:start"
            exit 1
          fi
        fi

        echo

        # 4. Test GitHub connectivity
        echo "=== GitHub Connectivity ==="
        echo "Testing connection to git@github.com..."
        if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -T git@github.com 2>/dev/null; then
          echo "✓ GitHub is reachable"
        else
          # ssh returns 1 when it connects but has no key for the host
          # that's actually fine — it just means github doesn't have our key
          echo "✓ GitHub is reachable (agent responded)"
          echo "  Note: 'git@github.com: Permission denied' is normal if"
          echo "  your key is not registered with GitHub. The agent still works."
        fi

        echo
        echo "=== All checks passed ==="
        echo "  You can push from the container using your host's SSH keys."

  start:
    desc: Start SSH agent and add default key
    cmds:
      - |
        echo "=== Starting SSH Agent ==="
        echo

        # Check if already running
        if [ -n "$SSH_AGENT_PID" ] && kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
          echo "✓ SSH agent already running (PID: $SSH_AGENT_PID)"
          echo "  Socket: $SSH_AUTH_SOCK"
          echo
          echo "Loaded keys:"
          ssh-add -l 2>/dev/null || echo "  (no keys loaded)"
        else
          # Start new agent
          echo "Starting ssh-agent..."
          eval "$(ssh-agent -s)"
          echo "✓ Agent started"
          echo "  PID: $SSH_AGENT_PID"
          echo "  Socket: $SSH_AUTH_SOCK"
          echo
          echo "  Add your keys with:"
          echo "    ssh-add ~/.ssh/<your-key>"
        fi

        echo

        # Try to add common key paths automatically
        COMMON_KEYS=(
          "$HOME/.ssh/id_ed25519"
          "$HOME/.ssh/id_rsa"
          "$HOME/.ssh/github_key"
        )

        for key in "${COMMON_KEYS[@]}"; do
          if [ -f "$key" ] && ! ssh-add -l 2>/dev/null | grep -q "$key"; then
            echo "Found: $key"
            ssh-add "$key" 2>/dev/null && echo "  ✓ Added" || echo "  ✗ Failed (check passphrase)"
          fi
        done

        echo
        echo "=== Current Keys ==="
        if ssh-add -l 2>/dev/null; then
          echo
          echo "Ready to push from the container."
        else
          echo "No keys loaded. Add manually:"
          echo "  ssh-add ~/.ssh/<your-key>"
        fi

  status:
    desc: Show current SSH agent status
    cmds:
      - |
        echo "=== SSH Agent Status ==="
        echo

        if [ -z "$SSH_AUTH_SOCK" ]; then
          echo "✗ SSH_AUTH_SOCK: not set"
          echo "  Run: task ssh:start"
          exit 1
        fi

        echo "✓ SSH_AUTH_SOCK: $SSH_AUTH_SOCK"

        if [ -n "$SSH_AGENT_PID" ]; then
          if kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
            echo "✓ Agent PID: $SSH_AGENT_PID (running)"
          else
            echo "✗ Agent PID: $SSH_AGENT_PID (not running)"
          fi
        else
          echo "? Agent PID: unknown"
        fi

        echo

        echo "=== Loaded Keys ==="
        if ssh-add -l 2>/dev/null; then
          :
        else
          code=$?
          if [ $code -eq 1 ]; then
            echo "  No keys loaded"
          else
            echo "  Cannot list keys (agent not accessible)"
          fi
        fi

        echo
        echo "=== GitHub Test ==="
        result=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -T git@github.com 2>&1)
        echo "  $result"

  stop:
    desc: Stop the SSH agent
    cmds:
      - |
        if [ -z "$SSH_AGENT_PID" ]; then
          echo "SSH_AGENT_PID not set. Nothing to stop."
          exit 0
        fi

        if kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
          echo "Stopping SSH agent (PID: $SSH_AGENT_PID)..."
          kill "$SSH_AGENT_PID"
          echo "✓ Agent stopped"
          echo
          echo "Note: SSH_AUTH_SOCK still points to the old socket."
          echo "Start a new shell or run:"
          echo "  unset SSH_AUTH_SOCK SSH_AGENT_PID"
        else
          echo "Agent PID $SSH_AGENT_PID is not running. Nothing to stop."
        fi