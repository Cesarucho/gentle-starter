version: "3"

tasks:
  update:
    desc: Update Pi packages and re-pin selected packages
    silent: true
    vars:
      PINNED_PI_PACKAGES: '{{.PINNED_PI_PACKAGES | default "pi-mcp-adapter"}}'
    cmds:
      - |
        set -e

        if ! pi update; then
          echo "pi update could not self-update. Falling back to sudo npm global update..."
          sudo npm --prefix /usr install -g --ignore-scripts --min-release-age=0 @earendil-works/pi-coding-agent
        fi

        for package_name in {{.PINNED_PI_PACKAGES}}; do
          package_version="$(npm view "${package_name}" version)"
          echo "Pinning ${package_name}@${package_version} in Pi settings..."
          pi install "npm:${package_name}@${package_version}"
        done

  update-tags:
    silent: true
    desc: Update package version tags in repo config files from npm (reads PACKAGES from install script)
    cmds:
      - |
        set -e

        WORKSPACE="${HOME}/gentle-starter"
        INSTALL_SCRIPT="${WORKSPACE}/.devcontainer/install/available/30-ai-pi-gentle.sh"
        SETTINGS_JSON="${WORKSPACE}/.devcontainer/pi-config/agent/settings.json"

        # Parse package names from the install script's PACKAGES array
        echo "=== Reading packages from ${INSTALL_SCRIPT} ==="
        mapfile -t LINES < <(sed -n '/^[[:space:]]*PACKAGES=/,/^[[:space:]]*)$/p' "${INSTALL_SCRIPT}" | grep -oP 'npm:\K[^@]+')

        if [ ${#LINES[@]} -eq 0 ]; then
          echo "No packages found in ${INSTALL_SCRIPT}"
          exit 1
        fi

        declare -A VERSIONS
        echo
        echo "=== Checking npm versions ==="
        for pkg in "${LINES[@]}"; do
          version=$(npm view "${pkg}" version 2>/dev/null)
          if [ -n "${version}" ]; then
            VERSIONS["${pkg}"]="${version}"
            echo "  ${pkg}@${version}"
          else
            echo "  ${pkg}: failed to fetch"
          fi
        done
        echo

        # Update settings.json (pi-config/agent/settings.json)
        echo "=== Updating ${SETTINGS_JSON} ==="
        for pkg in "${!VERSIONS[@]}"; do
          version="${VERSIONS[${pkg}]}"
          escaped=$(printf '%s' "${pkg}" | sed 's/[/]/\\\//g')
          if grep -q "${escaped}@" "${SETTINGS_JSON}"; then
            sed -i "s|${escaped}@[0-9][0-9.]*|${escaped}@${version}|g" "${SETTINGS_JSON}"
            echo "  ✓ ${pkg} -> ${version}"
          else
            echo "  - ${pkg} (not pinned in file)"
          fi
        done
        echo

        # Update install script (30-ai-pi-gentle.sh)
        echo "=== Updating ${INSTALL_SCRIPT} ==="
        for pkg in "${!VERSIONS[@]}"; do
          version="${VERSIONS[${pkg}]}"
          escaped=$(printf '%s' "${pkg}" | sed 's/[/]/\\\//g')
          if grep -q "${escaped}@" "${INSTALL_SCRIPT}"; then
            sed -i "s|${escaped}@[0-9][0-9.]*|${escaped}@${version}|g" "${INSTALL_SCRIPT}"
            echo "  ✓ ${pkg} -> ${version}"
          else
            echo "  - ${pkg} (not found in file)"
          fi
        done
        echo
        echo "Done. Review changes with: git diff"

  configure-models:
    desc: Update Gentle AI model and effort configuration with Pi
    cmds:
      - |
        pi 'Assign the best model/effort configuration for each gentle-ai agent in @.devcontainer/pi-config/gentle-ai/models.json using the available models (pi --list-models) and following this guide: @docs/assets/ref/GUIA_MODELOS_v4.md'
