version: "3"

tasks:
  update:
    desc: Update Pi packages and re-pin selected packages
    silent: true
    vars:
      PINNED_PI_PACKAGES: '{{.PINNED_PI_PACKAGES | default "pi-mcp-adapter"}}'
    cmds:
      - |
        set -e

        if ! pi update; then
          echo "pi update could not self-update. Falling back to sudo npm global update..."
          sudo npm --prefix /usr install -g --ignore-scripts --min-release-age=0 @earendil-works/pi-coding-agent
        fi

        for package_name in {{.PINNED_PI_PACKAGES}}; do
          package_version="$(npm view "${package_name}" version)"
          echo "Pinning ${package_name}@${package_version} in Pi settings..."
          pi install "npm:${package_name}@${package_version}"
        done

  configure-models:
    desc: Update Gentle AI model and effort configuration with Pi
    cmds:
      - |
        pi 'Assign the best model/effort configuration for each gentle-ai agent in @.devcontainer/pi-config/gentle-ai/models.json using the available models (pi --list-models) and following this guide: @docs/assets/ref/GUIA_MODELOS_v4.md'
