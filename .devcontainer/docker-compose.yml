services:
  container-svc:
    image: "${APP_NAME}-img:0.1"
    container_name: "${APP_NAME}-run"
    build:
      context: .
      dockerfile: ./Dockerfile
    privileged: true
    # Bind mounts below are stateful volumes. Each one is parsed by
    # setup-volumes.sh at container start and re-populated by the
    # install script(s) that own it (see compose_target_to_install_scripts
    # in that file). When you add a new bind mount here, also add the
    # matching case in .devcontainer/setup-volumes.sh, otherwise the
    # volume will be created empty and stay empty. Run
    # `task install:volumes` to inspect the current contract end-to-end.
    volumes:
      # AI-TOOLS
      - ../env/.pi:/home/ubuntu/.pi
      - ../env/.engram:/home/ubuntu/.engram
      # - ../env/.opencode:/home/ubuntu/.config/opencode
      # GIT-CONFIG
      - ../env/.gitconfig:/home/ubuntu/.gitconfig-volume
    ports:
      - "${APP_PORT}:${APP_PORT}"    # port for you app
    env_file:
      - ../.env
