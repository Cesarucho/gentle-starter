services:
  vunov-chatbot:
    image: vunov-chatbot:0.1
    container_name: vunov-chatbot
    build:
      context: .
      dockerfile: ./Dockerfile
    privileged: true
    volumes:
      # AI-TOOLS
      - ../env/.pi:/home/ubuntu/.pi
      - ../env/.engram:/home/ubuntu/.engram
      # GIT-CONFIG
      - ../env/.gitconfig:/home/ubuntu/.gitconfig-volume
    env_file:
      - ../.env