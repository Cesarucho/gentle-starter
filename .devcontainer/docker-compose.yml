services:
  dev:
    image: gentle-starter-img:0.1
    container_name: gentle-starter-run
    build:
      context: .
      dockerfile: ./Dockerfile
    privileged: true
    volumes:
      # AI-TOOLS
      - ../env/.pi:/home/ubuntu/.pi
      - ../env/.engram:/home/ubuntu/.engram
      # GIT-CONFIG
      - ../env/.gitconfig:/home/ubuntu/.gitconfig-volume
    env_file:
      - ../.env
