services:
  container-svc:
    image: "${APP_NAME}-img:0.1"
    container_name: "${APP_NAME}-run"
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: ${APP_NAME}
        LOCALE: ${LOCALE}
        TZ: ${TZ}
    privileged: true
    environment:
      # Task computes and exports this bind-manifest ID automatically; do not set it manually.
      DEVCONTAINER_BIND_MANIFEST_ID: ${DEVCONTAINER_BIND_MANIFEST_ID:-}
    ports:
      - "${APP_PORT}:${APP_PORT}" # App port
    env_file:
      - ../.env
