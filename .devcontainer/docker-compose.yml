services:
  skeleton-env:
    image: skeleton-env:0.1
    container_name: skeleton-env
    build:
      context: .
      dockerfile: ./Dockerfile
    privileged: true
    volumes:
      # AI-TOOLS
      - ../env/.pi:/home/ubuntu/.pi
      - ../env/.engram:/home/ubuntu/.engram
      # - ../env/.opencode:/home/ubuntu/.opencode
      # GIT-CONFIG
      - ../env/.gitconfig:/home/ubuntu/.gitconfig-volume
    env_file:
      - ../.env

# volumes:
