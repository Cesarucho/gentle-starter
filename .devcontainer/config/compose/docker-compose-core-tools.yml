services:
  container-svc:
    # All sources resolve relative to the first Compose file, ../docker-compose.yml.
    # Task prepares these sources; startup validates the applied manifest identity.
    volumes:
      - type: bind
        source: ../.env.d/.engram
        target: /home/ubuntu/.engram
        bind: { create_host_path: false }
      - type: bind
        source: ../.env.d/.opencode/share
        target: /home/ubuntu/.local/share/opencode
        bind: { create_host_path: false }
      - type: bind
        source: ../.env.d/.gentle-ai
        target: /home/ubuntu/.gentle-ai
        bind: { create_host_path: false }
      - type: bind
        source: ../.env.d/.gitconfig
        target: /home/ubuntu/.gitconfig-volume
        bind: { create_host_path: false }
    ports:
      - "${OPENCODE_PORT}:4096"
