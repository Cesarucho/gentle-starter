# Canonical version and integrity policy for devcontainer install scripts.
# TOOL_*_VERSION fields are user-editable intent. `task tools:update` advances
# complete bare SemVer baselines together with their validated generated locks.
# Channels, partials, = pins, and provider-specific intents stay unchanged;
# kubectl and PlantUML retain their declared floors even with three segments.
# Only `task tools:update` may replace the generated lock. Updates do not install tools.
# The file remains assignment-only: quoted, non-empty TOOL_* and LOCK_* values.

# Editable tool intent, grouped by owning installer.

# Java — install/available/20-runtime-java.sh
TOOL_JAVA_VERSION="25-tem"

# Node.js — install/available/20-runtime-node.sh
TOOL_NODE_VERSION="26"

# Go — install/available/20-runtime-go.sh
TOOL_GO_VERSION="latest"

